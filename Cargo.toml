[package]
name = "tabular"
version = "0.12.0"
edition = "2024"

[lib]
name = "tabular"
crate-type = ["rlib", "staticlib"]

# Cargo.toml
[package.metadata.bundle]
name = "Tabular"
identifier = "id.tabular.database"
icon = ["assets/AppIcon.icns"]
category = "Developer Tool"
copyright = "Copyright © 2025 Y.N Pamungkas Jayuda"
info = "Your SQL Editor, Forged with Rust: Fast, Safe, Efficient."

[dependencies]
eframe = "0.36"
image = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", features = [
       "runtime-tokio",
       "tls-native-tls",
       "sqlite",
       "mysql",
       "postgres",
       "chrono",
       "rust_decimal",
] }
# Force bundled SQLite to avoid missing runtime symbols (e.g., sqlite3_db_config) in
# Arch build chroot; ensures libsqlite3-sys builds its own recent SQLite.
# NOTE: capped at 0.37 — sqlx-sqlite 0.9 requires libsqlite3-sys <0.38 and the
# `links = "sqlite3"` constraint allows only one version in the tree.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
sqlparser = { version = "0.62", optional = true }
sqlformat = "0.5.0"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
bson = { version = "3", features = ["uuid-1"] }
mongodb = { version = "3.8.0", features = ["zlib-compression"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
egui_extras = { version = "0.36", features = ["datepicker"] }
egui_commonmark = { version = "0.25", features = ["pulldown_cmark"] }
# Date type consumed by egui_extras' DatePickerButton (chrono elsewhere).
jiff = "0.2"
colorful = "0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
regex = "1.13"
unicode-segmentation = "1.13"
csv = "1.4"
rust_xlsxwriter = "0.98"                           # Pure-Rust xlsx writer (no libclang/C toolchain)
hex = "0.4.3"
rust_decimal = "1.42.1"
log = "0.4"
env_logger = "0.11"
dotenv = "0.15.0"
md5 = "0.8"
# Pinned exact: pre-1.0 API moves between minors (replaces tiberius + deadpool-tiberius)
mssql-client = { version = ">=0.20.0", features = [
       "chrono",
       "decimal",
       "uuid",
] }
mssql-driver-pool = ">=0.20.0"
futures-util = "0.3"
# Self-update dependencies
reqwest = { version = "0.13", features = [
       "json",
       "multipart",
       "form",
       "rustls",
       "stream",
       "blocking",
], default-features = false }
semver = "1.0"
flate2 = "1.1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

tree-sitter = { version = "0.26", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }
tree-sitter-json = "0.24.8"
tree-sitter-javascript = "0.25.0"
# Tree-sitter highlighter engine for query-based syntax scopes
anyhow = { version = "1", optional = true }
once_cell = "1"
thiserror = "2"
async-trait = "0.1.92"
cargo-deb = "3.7.0"
# Cipher for the encrypted-file secret store fallback (src/secrets.rs);
# the primary OS-keychain backends are declared per-target below.
chacha20poly1305 = "0.11"

# ─── Sync & Collaboration (optional, feature-gated) ─────────────────────────
# CRDT engine (Yjs port for Rust) — only needed for realtime collaborative editing.
# small-client keeps 32-bit ClientID for wire-compat with tabular-server until server is also on 0.27
yrs = { version = "0.27", features = ["small-client"], optional = true }
# WebSocket client for collab rooms — only needed for realtime collaborative editing.
tokio-tungstenite = { version = "0.30", features = [
       "native-tls",
], optional = true }

# ─── Vault crypto (src/sync/vault_crypto.rs) — NOT optional ────────────────
# End-to-end encryption for synced connection credentials & HTTP client secrets.
# These are non-optional: sync/login is always compiled in (not behind `collab`),
# so gating the crypto behind an opt-in feature silently downgraded release
# builds to a plaintext/base64 no-op — see SECURITY.md.
aes-gcm = { version = "0.11" }                                    # symmetric encryption of synced payloads
sha2 = { version = "0.11" }                                       # hashing (checksums, KDF glue)
base64 = "0.23"
rand = { version = "0.10" }                                       # AES-GCM nonce generation
argon2 = { version = "0.5", features = ["std"] }                  # Sync Passphrase -> KEK (Argon2id)
crypto_box = { version = "0.9", features = ["seal", "std"] }      # X25519 sealed boxes for Team vault key sharing
zeroize = { version = "1", features = ["zeroize_derive"] }        # scrub key material from memory

# OS keychain backends (see src/secrets.rs). Linux is opt-in via the
# `linux-keyring` feature because Secret Service pulls a D-Bus build/runtime
# dependency into the packaging chain (deb/flatpak/AUR); without it Linux
# uses the encrypted-file store.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[target.'cfg(not(target_os = "ios"))'.dependencies]
rfd = "0.17"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
keyring = "4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", optional = true }

[features]
default = ["tree_sitter_sequel", "query_ast"]

# Linux only: store secrets in the freedesktop Secret Service instead of the
# encrypted file (requires libdbus at build/run time).
linux-keyring = ["dep:keyring"]

# Enable experimental tree-sitter SQL highlighting / structural parsing.
tree_sitter_sequel = ["tree-sitter", "tree-sitter-sequel", "anyhow"]

# Enable experimental logical query AST parsing + emission (phase 1: simple SELECT)
query_ast = ["sqlparser"]
sqlparser = ["dep:sqlparser"]

# Enable realtime collaborative editing (CRDT rooms + WebSocket).
# Vault/E2E crypto and REST sync are always compiled in — see the
# "Vault crypto" dependency block above.
collab = [
       "dep:yrs",
       "dep:tokio-tungstenite",
]

# removed lapce_core in egui-only mode


[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[package.metadata.deb]
name = "tabular"
maintainer = "Tabular Team <yulius.jayuda@gmail.com>"
copyright = "Copyright © 2025 Y.N Pamungkas Jayuda"
license-file = ["LICENSE", "4"]
section = "utils"
priority = "optional"
depends = [
       "libc6",
       "libssl3",
       "libgtk-3-0",
       "libxcb1",
       "libxkbcommon0",
       "libglib2.0-0",
]
assets = [
       [
              "tabular.desktop",
              "usr/share/applications/tabular.desktop",
              "644",
       ],
       [
              "assets/logo.png",
              "usr/share/icons/hicolor/512x512/apps/tabular.png",
              "644",
       ],
       [
              "LICENSE",
              "usr/share/doc/tabular/LICENSE",
              "644",
       ],
       [
              "LICENSE-AGPL",
              "usr/share/doc/tabular/LICENSE-AGPL",
              "644",
       ],
]
extended-description = "Tabular helps you explore and query SQL and NoSQL databases from a single desktop app."
recommends = ["update-desktop-database", "gtk-update-icon-cache"]
maintainer-scripts = "debian"
