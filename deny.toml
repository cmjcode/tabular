# Konfigurasi cargo-deny (https://embarkstudios.github.io/cargo-deny/).
# Dijalankan CI sebagai `cargo deny check advisories bans sources` dan wajib
# lolos. Versi crate ganda masih "warn" (lihat [bans]).

[graph]
all-features = true

[advisories]
version = 2
# Crate yang ditarik (yanked) dilaporkan, belum menggagalkan.
yanked = "warn"
# Advisory yang sudah ditinjau dan diterima; sertakan alasannya. Semuanya
# berstatus "unmaintained" (bukan kerentanan) pada dependensi transitif tanpa
# pengganti; tinjau ulang saat crate induknya naik versi.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: proc-macro, via image/rav1e and walkers; no runtime input" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: via egui/epaint and resvg font rendering; only bundled fonts are parsed" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: via resvg/usvg SVG text shaping; no maintained replacement in resvg 0.45" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr: transitive, small-string container; no replacement upstream yet" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: via keyring's Linux Secret Service backend (zbus)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: via keyring's Linux Secret Service backend (zbus)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via keyring's Linux Secret Service backend (zbus)" },
]

[bans]
# Versi ganda belum ditriase: bson 2 + 3 (mongodb memakai bson 2 kecuali fitur
# `bson-3`), base64 0.21/0.22/0.23, penyedia kripto rustls ring + aws-lc-rs.
# Naikkan ke "deny" setelah daftar `skip` diisi.
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = [
       # Hanya satu SQLite yang boleh di-link (sqlite-vec menaut ke yang ini).
       { crate = "libsqlite3-sys", deny-multiple-versions = true },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
