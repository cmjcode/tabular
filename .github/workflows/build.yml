name: Build and Release

# Build Tabular untuk Linux dan Windows lalu mengunggah hasilnya ke GitHub Release.
#   - push tag `v*`      : build + publish ke release tag tersebut
#   - workflow_dispatch  : build ulang sebuah tag yang sudah ada (mis. bila run
#                          sebelumnya gagal) tanpa perlu membuat tag baru
# Lint/test per push ada di rust.yml. macOS (DMG/PKG) dibangun, ditandatangani dan
# dinotarisasi secara lokal (build.sh / notarize.sh) lalu diunggah ke release yang sama;
# job release di bawah hanya menambah asset, tidak menimpa catatan rilis atau asset lain.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag yang sudah ada untuk dibangun dan dipublikasikan (mis. v1.4.0)'
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Versi di Cargo.toml menentukan nama asset (dan dibaca auto-updater), jadi harus
  # sama dengan tag sebelum ada yang dibangun.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Check tag matches Cargo.toml version
      id: version
      run: |
        ver=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
        if [[ "$RELEASE_TAG" != "v$ver" ]]; then
          echo "::error::Tag $RELEASE_TAG tidak sama dengan versi Cargo.toml (v$ver)"
          exit 1
        fi
        echo "version=$ver" >> "$GITHUB_OUTPUT"

  # ─── Linux ─────────────────────────────────────────────────────────────────
  # Build native per arsitektur (tanpa `cross`): proc-macro sqlx menarik
  # native-tls -> openssl-sys untuk HOST, dan fitur `vendored` hanya berlaku untuk
  # target, sehingga container cross gagal karena tidak punya libssl-dev.
  # Ubuntu 22.04 dipakai agar binary tetap jalan di glibc >= 2.35.
  # Menghasilkan:
  #   tabular-<target>.tar.gz        ← dipakai auto-updater (src/self_update.rs)
  #   tabular_<ver>_<amd64|arm64>.deb
  build-linux:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Install system dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y pkg-config libssl-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: release-${{ matrix.target }}

    - name: Build for ${{ matrix.target }}
      run: cargo build --release --target ${{ matrix.target }}

    - name: Create tarball
      run: |
        mkdir -p dist/linux
        cp target/${{ matrix.target }}/release/tabular dist/linux/tabular-${{ matrix.target }}
        tar -C dist/linux -czf dist/linux/tabular-${{ matrix.target }}.tar.gz tabular-${{ matrix.target }}

    - name: Create .deb package
      run: ./build_deb.sh --target ${{ matrix.target }} --skip-build

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tabular-linux-${{ matrix.target }}
        if-no-files-found: error
        path: |
          dist/linux/tabular-${{ matrix.target }}.tar.gz
          dist/deb/tabular_*.deb

  # ─── Windows ───────────────────────────────────────────────────────────────
  # Menghasilkan ZIP (portable) + MSI installer. Nama asset konsisten dengan
  # auto-updater di src/self_update.rs:
  #   tabular-<ver>-windows-<arch>.zip   ← ZIP portable
  #   Tabular-<ver>-windows-<arch>.msi   ← MSI installer (diprioritaskan untuk auto-update)
  build-windows:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch_name: x86_64
            wix_arch: x64
          - target: aarch64-pc-windows-msvc
            arch_name: aarch64
            wix_arch: arm64

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: release-${{ matrix.target }}

    - name: Build for ${{ matrix.target }}
      run: cargo build --release --target ${{ matrix.target }}

    # ── ZIP portable ──────────────────────────────────────────────────────────
    - name: Create ZIP archive
      shell: pwsh
      run: |
        $ver      = '${{ needs.version.outputs.version }}'
        $arch     = '${{ matrix.arch_name }}'
        $exeSrc   = "target\${{ matrix.target }}\release\tabular.exe"
        $distDir  = "dist\windows"
        $zipName  = "tabular-$ver-windows-$arch.zip"

        New-Item -ItemType Directory -Force -Path $distDir | Out-Null

        # Buat ZIP langsung dari binary (nama entry: tabular.exe)
        Compress-Archive -Path $exeSrc -DestinationPath "$distDir\$zipName"
        Write-Host "ZIP: $distDir\$zipName"

    # ── MSI via WiX ───────────────────────────────────────────────────────────
    # Versi dikunci ke v5: `wix` terbaru (v7) menolak build sebelum EULA Open Source
    # Maintenance Fee diterima (error WIX7015), dan wix/main.wxs ditulis untuk v4/v5.
    - name: Install WiX Toolset v5
      shell: pwsh
      run: dotnet tool install --global wix --version 5.0.2

    - name: Build MSI installer
      shell: pwsh
      run: |
        $ver      = '${{ needs.version.outputs.version }}'
        $arch     = '${{ matrix.arch_name }}'
        $wixArch  = '${{ matrix.wix_arch }}'
        $exeSrc   = "$PWD\target\${{ matrix.target }}\release\tabular.exe"
        $iconPath = "$PWD\assets\tabular.ico"
        $distDir  = "dist\windows"
        $msiName  = "Tabular-$ver-windows-$arch.msi"

        wix build wix\main.wxs `
          -arch $wixArch `
          -pdbtype none `
          -d "Version=$ver" `
          -d "ExePath=$exeSrc" `
          -d "IconPath=$iconPath" `
          -o "$distDir\$msiName"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "MSI build gagal untuk $arch"
          exit 1
        }
        Write-Host "MSI: $distDir\$msiName"

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tabular-windows-${{ matrix.arch_name }}
        if-no-files-found: error
        path: |
          dist/windows/tabular-*-windows-${{ matrix.arch_name }}.zip
          dist/windows/Tabular-*-windows-${{ matrix.arch_name }}.msi

  # ─── Publish ke GitHub Release ─────────────────────────────────────────────
  # Tetap jalan walau salah satu arsitektur gagal (run tetap merah), supaya satu
  # target yang bermasalah tidak menahan asset target lain. Release yang sudah ada
  # tidak dibuat ulang: asset hanya ditambahkan/ditimpa per nama.
  release:
    needs: [version, build-linux, build-windows]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: List assets
      run: |
        find dist -type f | sort
        if [[ -z "$(find dist -type f -print -quit)" ]]; then
          echo "::error::Tidak ada artifact yang berhasil dibangun"
          exit 1
        fi

    - name: Publish to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Release bisa sudah/sedang dibuat oleh build_apple.sh (upload macOS lokal);
        # jika create gagal karena balapan, cukup pastikan release-nya ada.
        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag \
            || gh release view "$RELEASE_TAG" >/dev/null
        fi
        find dist -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber

  # ─── Publish ke AUR (Arch User Repository) ─────────────────────────────────
  # Memperbarui dan mempublikasikan metadata paket Arch Linux (tabular & tabular-bin)
  aur:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Install tooling
      run: |
        pacman -Sy --noconfirm --needed git openssh rsync python

    - name: Check AUR SSH Key
      id: check-key
      env:
        AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      run: |
        if [ -z "${AUR_KEY}" ]; then
          echo "AUR_SSH_PRIVATE_KEY secret is not configured. Skipping AUR publish."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure SSH for AUR
      if: steps.check-key.outputs.skip != 'true'
      env:
        AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa -p 22 aur.archlinux.org >> ~/.ssh/known_hosts

    - name: Update AUR packages via update-aur.sh
      if: steps.check-key.outputs.skip != 'true'
      env:
        GIT_AUTHOR_NAME: Tabular CI
        GIT_AUTHOR_EMAIL: support@tabular.id
      run: |
        set -euo pipefail
        git config --global user.name "${GIT_AUTHOR_NAME}"
        git config --global user.email "${GIT_AUTHOR_EMAIL}"
        git config --global --add safe.directory '*'
        chmod +x ./scripts/update-aur.sh
        ./scripts/update-aur.sh all

