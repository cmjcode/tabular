name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Tabular

jobs:
  # Build for macOS — TIDAK DIUBAH
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build for ${{ matrix.target }}
      run: cargo build --release --target ${{ matrix.target }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tabular-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/tabular

  # Create macOS universal binary and bundle — TIDAK DIUBAH
  bundle-macos:
    needs: build-macos
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download x86_64 binary
      uses: actions/download-artifact@v4
      with:
        name: tabular-x86_64-apple-darwin
        path: target/x86_64-apple-darwin/release/
    
    - name: Download aarch64 binary
      uses: actions/download-artifact@v4
      with:
        name: tabular-aarch64-apple-darwin
        path: target/aarch64-apple-darwin/release/
    
    - name: Make binaries executable
      run: |
        chmod +x target/x86_64-apple-darwin/release/tabular
        chmod +x target/aarch64-apple-darwin/release/tabular
    
    - name: Install Rust and cargo-bundle
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin
    
    - name: Install cargo-bundle
      run: cargo install cargo-bundle
    
    - name: Create universal binary
      run: |
        mkdir -p target/universal-apple-darwin/release
        lipo -create \
          target/x86_64-apple-darwin/release/tabular \
          target/aarch64-apple-darwin/release/tabular \
          -output target/universal-apple-darwin/release/tabular
    
    - name: Create .app bundle
      run: |
        cargo bundle --release --target aarch64-apple-darwin
        cp target/universal-apple-darwin/release/tabular target/aarch64-apple-darwin/release/bundle/osx/${{ env.APP_NAME }}.app/Contents/MacOS/tabular
    
    - name: Create DMG
      run: |
        mkdir -p dist/macos
        cp -r target/aarch64-apple-darwin/release/bundle/osx/${{ env.APP_NAME }}.app dist/macos/
        hdiutil create -volname "${{ env.APP_NAME }}" -srcfolder dist/macos/${{ env.APP_NAME }}.app -ov -format UDZO dist/macos/${{ env.APP_NAME }}.dmg
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tabular-macos-universal
        path: |
          dist/macos/${{ env.APP_NAME }}.app
          dist/macos/${{ env.APP_NAME }}.dmg

  # Build for Linux — TIDAK DIUBAH
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Install cross
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    - name: Install aarch64 cross-compilation toolchain
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          libc6-dev-arm64-cross
    
    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build for ${{ matrix.target }}
      env:
        # Ensure vendored OpenSSL compiles correctly for cross targets
        OPENSSL_STATIC: "1"
        OPENSSL_NO_VENDOR: "0"
        PKG_CONFIG_ALLOW_CROSS: "1"
        # aarch64 cross-compiler binaries (no-op on x86_64 target)
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      run: cross build --release --target ${{ matrix.target }}
    
    - name: Create tarball
      run: |
        mkdir -p dist/linux
        cp target/${{ matrix.target }}/release/tabular dist/linux/tabular-${{ matrix.target }}
        cd dist/linux
        tar -czf tabular-${{ matrix.target }}.tar.gz tabular-${{ matrix.target }}
    
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: tabular-linux-${{ matrix.target }}
        path: dist/linux/tabular-${{ matrix.target }}.tar.gz

  # ─── Build for Windows (DIPERBAIKI) ────────────────────────────────────────
  # Menghasilkan: ZIP (portable) + MSI installer (via WiX v4)
  # Asset naming konsisten dengan auto_updater di src/self_update.rs:
  #   tabular-<ver>-windows-x86_64.zip   ← ZIP portable
  #   Tabular-<ver>-windows-x86_64.msi   ← MSI installer (diprioritaskan untuk auto-update)
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch_name: x86_64
            wix_arch: x64
          - target: aarch64-pc-windows-msvc
            arch_name: aarch64
            wix_arch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Read version from Cargo.toml
      id: version
      shell: pwsh
      run: |
        $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
        echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

    - name: Build for ${{ matrix.target }}
      run: cargo build --release --target ${{ matrix.target }}

    # ── ZIP portable ──────────────────────────────────────────────────────────
    - name: Create ZIP archive
      shell: pwsh
      run: |
        $ver      = '${{ steps.version.outputs.VERSION }}'
        $arch     = '${{ matrix.arch_name }}'
        $exeSrc   = "target\${{ matrix.target }}\release\tabular.exe"
        $distDir  = "dist\windows"
        $zipName  = "tabular-$ver-windows-$arch.zip"

        New-Item -ItemType Directory -Force -Path $distDir | Out-Null

        # Buat ZIP langsung dari binary (nama entry: tabular.exe)
        Compress-Archive -Path $exeSrc -DestinationPath "$distDir\$zipName"
        Write-Host "✅ ZIP: $distDir\$zipName"

    # ── MSI via WiX v4 ────────────────────────────────────────────────────────
    - name: Install WiX Toolset v4
      shell: pwsh
      run: dotnet tool install --global wix

    - name: Build MSI installer
      shell: pwsh
      run: |
        $ver      = '${{ steps.version.outputs.VERSION }}'
        $arch     = '${{ matrix.arch_name }}'
        $wixArch  = '${{ matrix.wix_arch }}'
        $exeSrc   = "$PWD\target\${{ matrix.target }}\release\tabular.exe"
        $iconPath = "$PWD\assets\tabular.ico"
        $distDir  = "dist\windows"
        $msiName  = "Tabular-$ver-windows-$arch.msi"

        wix build wix\main.wxs `
          -arch $wixArch `
          -d "Version=$ver" `
          -d "ExePath=$exeSrc" `
          -d "IconPath=$iconPath" `
          -o "$distDir\$msiName"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "MSI build gagal untuk $arch"
          exit 1
        }
        Write-Host "✅ MSI: $distDir\$msiName"

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tabular-windows-${{ matrix.arch_name }}
        path: |
          dist/windows/tabular-*-windows-${{ matrix.arch_name }}.zip
          dist/windows/Tabular-*-windows-${{ matrix.arch_name }}.msi

  # Create release on tag push — DIPERBARUI (tambahkan MSI ke upload)
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
    
    - name: Display structure
      run: ls -la dist/ && ls -la dist/tabular-windows-x86_64/ || true
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/tabular-macos-universal/${{ env.APP_NAME }}.dmg
          dist/tabular-linux-x86_64-unknown-linux-gnu/tabular-x86_64-unknown-linux-gnu.tar.gz
          dist/tabular-linux-aarch64-unknown-linux-gnu/tabular-aarch64-unknown-linux-gnu.tar.gz
          dist/tabular-windows-x86_64/tabular-*-windows-x86_64.zip
          dist/tabular-windows-x86_64/Tabular-*-windows-x86_64.msi
          dist/tabular-windows-aarch64/tabular-*-windows-aarch64.zip
          dist/tabular-windows-aarch64/Tabular-*-windows-aarch64.msi
        body: |
          ## 🎉 Release Notes
          
          ### 📦 Downloads
          
          **macOS Universal:**
          - `${{ env.APP_NAME }}.dmg` - Universal binary (Intel + Apple Silicon)
          
          **Linux:**
          - `tabular-x86_64-unknown-linux-gnu.tar.gz` - x86_64
          - `tabular-aarch64-unknown-linux-gnu.tar.gz` - ARM64
          
          **Windows:**
          - `Tabular-*-windows-x86_64.msi` - x86_64 Installer *(direkomendasikan, support auto-update)*
          - `tabular-*-windows-x86_64.zip` - x86_64 Portable
          - `Tabular-*-windows-aarch64.msi` - ARM64 Installer
          - `tabular-*-windows-aarch64.zip` - ARM64 Portable
          
          ### 🚀 Installation
          
          **macOS:** Download dan buka DMG, drag Tabular ke Applications
          **Linux:** Extract tarball dan jalankan binary
          **Windows (MSI):** Jalankan `.msi` → auto-update akan bekerja otomatis
          **Windows (Portable):** Extract zip ke folder mana saja → auto-update bekerja jika folder dapat ditulis
          
          Built with ❤️ using Rust 🦀
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
