name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Seluruh tree sudah diformat; format wajib lolos.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows belum diverifikasi di CI; kegagalannya tidak memblokir PR.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (collab feature)
        run: cargo clippy --all-targets --features collab -- -D warnings
      - name: Tests
        run: cargo test

  # Tes terhadap PostgreSQL dan MySQL sungguhan (src/connection/live_db_tests.rs):
  # simpan grid atomik dan daftar tabel sidebar. Tanpa env, tes ini lulus kosong.
  drivers:
    name: live database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tabular
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tabular
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TABULAR_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/tabular
      TABULAR_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/tabular
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live database tests
        run: cargo test --lib connection::live_db_tests -- --test-threads=1

  # Advisory keamanan (RustSec) diperiksa di setiap PR, bukan hanya oleh cron
  # bulanan di dependency-audit.yml.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Check for known security advisories
        run: cargo audit

  # Advisory, crate terlarang, dan sumber dependensi menurut deny.toml. Versi
  # ganda hanya peringatan (lihat [bans] di deny.toml).
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
