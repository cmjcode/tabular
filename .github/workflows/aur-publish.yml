name: Publish AUR Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package variant to update (tabular, tabular-bin, or all)'
        required: false
        default: 'all'
      pkgver:
        description: 'Override pkgver (without leading v)'
        required: false
        default: ''
      pkgrel:
        description: 'Override pkgrel (default: 1)'
        required: false
        default: ''

permissions:
  contents: read

env:
  GIT_AUTHOR_NAME: Tabular CI
  GIT_AUTHOR_EMAIL: support@tabular.id

jobs:
  aur:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          pacman -Sy --noconfirm --needed git openssh rsync python

      - name: Check AUR SSH Key
        id: check-key
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not set. Skipping AUR publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH for AUR
        if: steps.check-key.outputs.skip != 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa -p 22 aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Update AUR package(s) via update-aur.sh
        if: steps.check-key.outputs.skip != 'true'
        env:
          PKGVER: ${{ github.event.inputs.pkgver }}
          PKGREL: ${{ github.event.inputs.pkgrel }}
        run: |
          set -euo pipefail
          git config --global user.name "${GIT_AUTHOR_NAME}"
          git config --global user.email "${GIT_AUTHOR_EMAIL}"
          git config --global --add safe.directory '*'

          PACKAGE_ARG="${{ github.event.inputs.package || 'all' }}"
          chmod +x ./scripts/update-aur.sh
          ./scripts/update-aur.sh "${PACKAGE_ARG}"

      - name: Summary
        if: steps.check-key.outputs.skip != 'true'
        run: |
          echo "### AUR Packaging Update Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Updated AUR package(s) using \`scripts/update-aur.sh\`." >> "$GITHUB_STEP_SUMMARY"
